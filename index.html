<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>WARLORD RP — Древо исследований</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{color-scheme:dark;--bg:#050812;--panel:#101827;--panel2:#172238;--line:#2a3751;--text:#eef3ff;--muted:#9aabc4;--accent:#73d7ff;--good:#75f0a3;--warn:#ffd166;--bad:#ff6b6b;--shadow:0 18px 55px rgba(0,0,0,.35);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{height:100%;margin:0;background:radial-gradient(circle at top,#15223c 0,#050812 45%,#03050a 100%);color:var(--text);overflow:hidden}.topbar{height:76px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:rgba(5,8,18,.92);backdrop-filter:blur(18px);position:relative;z-index:5}.title h1{font-size:18px;line-height:1.1;margin:0}.title p{margin:5px 0 0;color:var(--muted);font-size:12px}.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}.badge,.zoomLabel{border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.04);padding:8px 10px;color:var(--muted);font-size:12px;white-space:nowrap}button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:9px 12px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,#168aad,#1a759f);border-color:#42c5ef}.viewport{height:calc(100% - 76px);overflow:scroll;cursor:grab;touch-action:none}.viewport.dragging{cursor:grabbing}.world{position:relative;width:3400px;height:2200px;transform-origin:0 0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:40px 40px}.branch{position:absolute;width:720px}.branch h2{font-size:18px;margin:0 0 12px;padding:10px 12px;border:1px solid var(--line);border-radius:18px;background:rgba(16,24,39,.88);box-shadow:var(--shadow)}.nodes{display:grid;grid-template-columns:repeat(2,340px);gap:14px}.card{min-height:226px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,rgba(16,24,39,.96),rgba(10,15,26,.96));box-shadow:var(--shadow);overflow:hidden;position:relative}.card img{width:100%;height:92px;object-fit:cover;display:block;filter:saturate(.9) contrast(1.05)}.body{padding:12px}.body h3{margin:0 0 7px;font-size:15px}.desc{font-size:12px;line-height:1.4;color:#c9d6e8;margin:8px 0}.meta{display:flex;flex-wrap:wrap;gap:6px}.pill{font-size:11px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.045);color:var(--muted);padding:5px 7px}.status{position:absolute;top:8px;right:8px;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:900;background:rgba(0,0,0,.52);border:1px solid rgba(255,255,255,.16)}.studied{color:var(--good)}.active{color:var(--warn)}.locked{color:var(--bad)}.exclusiveNotice{padding:12px;border:1px solid rgba(255,209,102,.36);border-radius:16px;background:rgba(255,209,102,.1);color:#ffe5a3;margin:0 0 12px}.lines{position:absolute;inset:0;pointer-events:none}.modal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:flex-end;z-index:10}.modal.show{display:flex}.sheet{width:100%;max-height:72vh;overflow:auto;background:#0c1322;border:1px solid var(--line);border-radius:26px 26px 0 0;padding:18px;box-shadow:var(--shadow)}.sheet h2{margin:0 0 8px}.row{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:10px 0;color:#cad6e8}.row b{text-align:right}.range{width:160px}.help{position:fixed;left:14px;bottom:14px;max-width:420px;border:1px solid var(--line);border-radius:18px;background:rgba(5,8,18,.86);padding:10px 12px;color:var(--muted);font-size:12px;z-index:4}@media(max-width:720px){.topbar{height:112px;align-items:flex-start;flex-direction:column}.viewport{height:calc(100% - 112px)}.range{width:110px}.help{display:none}}
  </style>
</head>
<body>
<header class="topbar">
  <div class="title"><h1>🔬 WARLORD RP — 2D древо исследований</h1><p>Pan & Zoom: тащи карту мышью/пальцем, скролль вправо и вниз, меняй масштаб.</p></div>
  <div class="controls"><span class="badge" id="countryBadge">country_code: -</span><button id="zoomOut">−</button><input id="zoom" class="range" type="range" min="45" max="160" value="100"><button id="zoomIn">+</button><span class="zoomLabel" id="zoomLabel">100%</span></div>
</header>
<main id="viewport" class="viewport"><section id="world" class="world"><svg id="lines" class="lines" width="3400" height="2200"></svg><div id="branches"></div></section></main>
<div class="help">ОЯТ физически не добавляется в DOM для всех стран, кроме Паониции. Статусы: 🟢 изучено, 🟡 в процессе, 🔴 заблокировано.</div>
<div id="modal" class="modal"><div class="sheet"><h2 id="modalTitle"></h2><p id="modalDesc" class="desc"></p><div id="modalRows"></div><button class="primary" id="startBtn">Начать исследование</button><button id="closeBtn">Закрыть</button></div></div>
<script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();}
const params=new URLSearchParams(location.search);const init=tg?.initDataUnsafe||{};const user=init.user||{};const countryCode=(params.get('country_code')||localStorage.getItem('country_code')||user.language_code||'').toLowerCase();if(countryCode)localStorage.setItem('country_code',countryCode);countryBadge.textContent='country_code: '+(countryCode||'-');
let TECHS=null;let selected=null;const studied=new Set((params.get('studied')||'starter_rifles,starter_truck').split(',').filter(Boolean));const active=new Set((params.get('active')||'').split(',').filter(Boolean));
async function loadTechs(){try{TECHS=await fetch('techs.json',{cache:'no-store'}).then(r=>r.json());}catch(e){document.body.insertAdjacentHTML('beforeend','<pre style="position:fixed;inset:90px 16px;color:#ffb4b4">Не удалось загрузить techs.json: '+String(e)+'</pre>');return;}render();}
function allowedBranch(b){return !b.exclusive_country_code||b.exclusive_country_code===countryCode;}function statusOf(t){if(studied.has(t.id))return ['🟢 Изучено','studied'];if(active.has(t.id))return ['🟡 В процессе','active'];const miss=(t.requires||[]).filter(x=>!studied.has(x));return miss.length?['🔴 Заблокировано','locked']:['🔴 Заблокировано','locked'];}
function card(b,t,i){const [label,cls]=statusOf(t);return `<article class="card" id="node-${t.id}" data-id="${t.id}"><span class="status ${cls}">${label}</span><img src="${t.image_url}" alt="${escapeHtml(t.title)}"><div class="body"><h3>${escapeHtml(t.title)}</h3><div class="meta"><span class="pill">${t.cost.toLocaleString('ru-RU')} ВР</span><span class="pill">${t.daily_upkeep.toLocaleString('ru-RU')} ВР/день</span><span class="pill">${t.hours}ч</span>${t.building_required?`<span class="pill">${escapeHtml(t.building_required)}</span>`:''}</div><p class="desc">${escapeHtml(t.description)}</p><button onclick="openTech('${b.id}','${t.id}')">Открыть</button></div></article>`}
function render(){const branches=TECHS.branches.filter(allowedBranch);document.getElementById('branches').innerHTML=branches.map(b=>`<section class="branch" style="left:${b.x}px;top:${b.y}px"><h2>${b.title}</h2><div class="nodes">${b.techs.map((t,i)=>card(b,t,i)).join('')}</div></section>`).join('');requestAnimationFrame(drawLines);}
function drawLines(){lines.innerHTML='';const nodes=[...document.querySelectorAll('.card')];const byId=Object.fromEntries(nodes.map(n=>[n.dataset.id,n]));for(const b of TECHS.branches.filter(allowedBranch)){for(const t of b.techs){for(const r of t.requires||[]){if(!byId[r]||!byId[t.id])continue;const a=byId[r].getBoundingClientRect(),c=byId[t.id].getBoundingClientRect(),w=world.getBoundingClientRect();const x1=(a.left+a.width/2-w.left)/scale,y1=(a.top+a.height/2-w.top)/scale,x2=(c.left+c.width/2-w.left)/scale,y2=(c.top+c.height/2-w.top)/scale;const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',`M${x1},${y1} C${x1+130},${y1} ${x2-130},${y2} ${x2},${y2}`);path.setAttribute('stroke','#4aa3c7');path.setAttribute('stroke-width','3');path.setAttribute('fill','none');path.setAttribute('opacity','.48');lines.appendChild(path);}}}}
function openTech(bid,tid){const b=TECHS.branches.find(x=>x.id===bid),t=b.techs.find(x=>x.id===tid);selected={branch:b,tech:t};modalTitle.textContent=t.title;modalDesc.textContent=t.description;modalRows.innerHTML=`<div class="row"><span>Цена</span><b>${t.cost.toLocaleString('ru-RU')} ВР</b></div><div class="row"><span>Ежедневный уход</span><b>${t.daily_upkeep.toLocaleString('ru-RU')} ВР/день</b></div><div class="row"><span>Время</span><b>${t.hours}ч</b></div><div class="row"><span>Требования</span><b>${(t.requires||[]).join(', ')||'-'}</b></div><div class="row"><span>Здание</span><b>${t.building_required||'-'}</b></div>`;modal.classList.add('show');}
startBtn.onclick=()=>{if(!selected)return;const payload={type:'research_start',country_code:countryCode,tech_id:selected.tech.id};if(tg)tg.sendData(JSON.stringify(payload));else alert(JSON.stringify(payload,null,2));};closeBtn.onclick=()=>modal.classList.remove('show');function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
let scale=1;function setScale(v){scale=Math.max(.45,Math.min(1.6,v));world.style.transform=`scale(${scale})`;zoom.value=Math.round(scale*100);zoomLabel.textContent=Math.round(scale*100)+'%';drawLines();}zoom.oninput=e=>setScale(Number(e.target.value)/100);zoomIn.onclick=()=>setScale(scale+.1);zoomOut.onclick=()=>setScale(scale-.1);
let dragging=false,lastX=0,lastY=0;viewport.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;viewport.setPointerCapture(e.pointerId);viewport.classList.add('dragging')});viewport.addEventListener('pointermove',e=>{if(!dragging)return;viewport.scrollLeft-=e.clientX-lastX;viewport.scrollTop-=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY});viewport.addEventListener('pointerup',()=>{dragging=false;viewport.classList.remove('dragging')});viewport.addEventListener('scroll',()=>requestAnimationFrame(drawLines));loadTechs();
</script>
</body>
</html>
