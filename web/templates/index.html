<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>RP Панель</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}"/>
</head>
<body>
  <header class="topbar">
    <h1>🌍 RP Панель</h1>
    <div class="auth-box">
      <input id="auth-tg" placeholder="Telegram ID" />
      <input id="auth-pass" type="password" placeholder="Пароль" />
      <input id="auth-2fa" type="password" placeholder="2FA PIN (если есть)" />
      <button id="auth-login">Войти</button>
      <button id="auth-register">Регистрация</button>
      <button id="auth-logout">Выйти</button>
      <span id="auth-state"></span>
    </div>
    <label>Страна:
      <select id="country"></select>
    </label>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="map">Карта ресурсов</button>
    <button class="tab" data-tab="research">Исследования</button>
  </nav>

  <main>
    <section id="tab-map" class="tab-pane active">
      <div class="layout">
        <div>
          <div class="filters">
            <label><input type="checkbox" id="filter-territories" checked/> Страны</label>
            <label><input type="checkbox" id="filter-resources" checked/> Ресурсы</label>
            <label><input type="checkbox" id="filter-animals" checked/> Животные</label>
            <label><input type="checkbox" id="filter-capitals" checked/> Столицы</label>
            <button id="map-refresh">Обновить</button>
            <button id="poly-edit-toggle">✏️ Редактор границ</button>
            <button id="poly-save" disabled>💾 Сохранить регион</button>
            <span id="poly-state"></span>
          </div>

          <div id="map-wrap" class="map-wrap">
            <img id="satellite-layer" src="{{ url_for('static', filename='images/satellite.svg') }}" class="layer" alt="satellite"/>
            <img id="territory-layer" src="{{ url_for('static', filename='images/territories.svg') }}" class="layer top" alt="territories"/>
            <svg id="map-overlay" viewBox="0 0 1200 800"></svg>
            <div id="point-popup" class="popup hidden"></div>
          </div>

          <section class="admin">
            <h3>Админ-режим</h3>
            <p>JSON-команды (пример): {"mode":"resource","action":"update","id":"stone_1","owner":"Обоссляндия","amount":450}</p>
            <textarea id="admin-json" rows="3"></textarea>
            <button id="admin-apply">Применить</button>
          </section>
        </div>

        <aside>
          <h3>Легенда</h3>
          <div id="legend"></div>
        </aside>
      </div>
    </section>

    <section id="tab-research" class="tab-pane">
      <section class="card">
        <div id="stats"></div>
      </section>
      <section class="card">
        <h2>Активные исследования</h2>
        <div id="active"></div>
      </section>
      <section class="card">
        <h2>Tech Tree</h2>
        <div id="tree" class="grid"></div>
      </section>
    </section>
  </main>

  <template id="techTpl">
    <article class="tech">
      <h3 class="name"></h3>
      <p class="desc"></p>
      <p class="meta"></p>
      <p class="status"></p>
      <button>Исследовать</button>
    </article>
  </template>

  <script src="{{ url_for('static', filename='js/research.js') }}"></script>
  <script src="{{ url_for('static', filename='js/map.js') }}"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
